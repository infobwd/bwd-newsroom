name: BWD Newsroom live Pages smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live smoke script syntax
        run: node --check scripts/verify-live-pages.mjs
      - name: Verify public Pages URLs and approved issue checksums
        run: node scripts/verify-live-pages.mjs
      - name: Check Gallery live smoke script syntax
        run: node --check scripts/verify-live-gallery.mjs
      - name: Verify public Gallery and all approved photo checksums
        run: node scripts/verify-live-gallery.mjs
