name: BWD Newsroom static QA
on:
  push:
    branches: [main, feat/n02-bookshelf-flipbook, feat/n02-mobile-immersive-reader]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/gallery.js
          node --check assets/ui-motion.js
          node --check assets/reader.js
          node --check assets/reader-geometry.js
          node --check scripts/validate-catalog.mjs
          node --check scripts/validate-books.mjs
          node --check scripts/validate-galleries.mjs
      - name: Validate approved public manifests
        run: |
          node scripts/validate-catalog.mjs
          node scripts/validate-books.mjs
          node scripts/validate-galleries.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Canva export preparation safeguards (synthetic fixtures only)
        run: |
          python -m pip install 'Pillow>=11,<13' 'PyMuPDF>=1.24,<2'
          python -m unittest discover -s tests -p test_prepare_issue_export.py -v
      - name: Regression tests
        run: |
          node tests/n01.test.mjs
          node tests/n01-gallery.test.mjs
          node tests/n01-ui-motion.test.mjs
          node tests/n02.test.mjs
          node tests/n02-mobile.test.mjs
